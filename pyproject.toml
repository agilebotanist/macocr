[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macocr"
version = "0.1.0"
description = "OCR for PDFs and images using the native macOS Vision framework."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "agilebotanist" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS :: MacOS X",
    "Environment :: Console",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
]
dependencies = [
    "pymupdf>=1.23",
    "pyobjc-framework-Cocoa>=9",
    "pyobjc-framework-Quartz>=9",
    "pyobjc-framework-Vision>=9",
]

[project.urls]
Homepage = "https://github.com/agilebotanist/macocr"

[project.scripts]
macocr = "macocr.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/macocr"]

[tool.pytest.ini_options]
markers = ["integration: real Vision OCR calls; opt-in with -m integration"]
addopts = "-m 'not integration'"
